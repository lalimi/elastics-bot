<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зелена хвиля — тренажер ПДР</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAED; --surface:#FFFFFF; --surface2:#F2F4F6; --ink:#1D2128; --muted:#58616D; --line:#D0D5DB;
  --sign:#1D5DBF; --on-sign:#FFFFFF; --hw:#137A47; --stopred:#B92E2E;
  --yellow:#F2B705; --green:#16804A; --green-bg:#E2F3E9; --red:#C23131; --red-bg:#FAE6E6;
  --asphalt:#454A52; --mark:#F5F5F0; --verge:#C8D8C0; --curb:#B6BDC6; --focus:#F2B705;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171B; --surface:#1E2227; --surface2:#262B31; --ink:#ECEFF2; --muted:#9BA4AF; --line:#343A42;
    --sign:#2563C7; --hw:#18784A; --stopred:#A83030;
    --green:#45C281; --green-bg:#16301F; --red:#F26B6B; --red-bg:#3A1C1E;
    --asphalt:#30353C; --mark:#D8DAD4; --verge:#22302A; --curb:#3A4048;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171B; --surface:#1E2227; --surface2:#262B31; --ink:#ECEFF2; --muted:#9BA4AF; --line:#343A42;
  --sign:#2563C7; --hw:#18784A; --stopred:#A83030;
  --green:#45C281; --green-bg:#16301F; --red:#F26B6B; --red-bg:#3A1C1E;
  --asphalt:#30353C; --mark:#D8DAD4; --verge:#22302A; --curb:#3A4048;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:'Fira Sans','Segoe UI',Roboto,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cond,.big,.t,.plate-t,.gtitle,.brand,.h2,.stat b,.pct{font-family:'Fira Sans Extra Condensed','Roboto Condensed','Arial Narrow',sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 16px 48px}

/* top bars */
.topbar,.qtop{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:25px;letter-spacing:.2px;flex:1}
.iconbtn{flex:none;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.gtitle{flex:1;font-weight:700;font-size:22px}

/* sign panels */
.sign-panel{background:var(--sign);color:var(--on-sign);border-radius:18px;padding:5px}
.sign-panel>.inner{border:2.5px solid rgba(255,255,255,.92);border-radius:14px;padding:16px 16px 14px}
.hello{margin:0;font-size:16px;opacity:.92}
.ready{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
.big{font-weight:800;font-size:68px;line-height:1}
.ready .lbl{font-size:17px;font-weight:500}
.road{position:relative;height:30px;border-radius:8px;background:#2D3137;margin:14px 0 14px}
.road::before{content:"";position:absolute;left:10px;right:34px;top:14px;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 10px,transparent 10px 19px)}
.road .trail{position:absolute;left:0;top:13px;height:4px;background:var(--yellow);border-radius:0 2px 2px 0}
.road .car{position:absolute;top:5px;transform:translateX(-50%);transition:left .9s cubic-bezier(.3,.7,.2,1)}
.road .finish{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:2px;background:conic-gradient(#fff 25%,#1d1d1d 0 50%,#fff 0 75%,#1d1d1d 0) 0 0/9px 9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px}

.goal{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:15px}
.goal-top b{font-size:15px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sign);border-radius:4px;transition:width .5s}
.goal .bar>i{background:var(--yellow)}

/* tiles */
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface)}
.tile .t{display:block;font-weight:700;font-size:21px;line-height:1.1}
.tile .d{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.3}
.tile .tx{flex:1;min-width:0}
.tile .chev{flex:none;opacity:.55}
.tile.col{flex-direction:column;align-items:flex-start;gap:10px}
.tile.exam{background:var(--sign);color:var(--on-sign);border:none;padding:5px}
.tile.exam .wrap{display:flex;gap:12px;align-items:center;width:100%;border:2.5px solid rgba(255,255,255,.92);border-radius:12px;padding:14px}
.tile.exam .d{color:rgba(255,255,255,.88)}
.tile.exam .t{font-size:26px}
.ico{flex:none;width:40px;height:40px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:22px 4px 0}

/* exam intro */
.rules{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin:14px 0}
.rule{display:flex;gap:14px;align-items:center;padding:14px 16px}
.rule+.rule{border-top:1.5px solid var(--line)}
.rule b{display:block;font-size:18px}
.rule span{color:var(--muted);font-size:14.5px}
.rule .num{flex:none;width:52px;height:52px;border-radius:50%;border:5px solid var(--stopred);background:#fff;color:#1D2128;display:grid;place-items:center;font-weight:800;font-size:20px;font-family:'Fira Sans Extra Condensed',sans-serif}

/* quiz */
.qprog{flex:1;min-width:0}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:5px;gap:8px}
.qmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud{flex:none;display:flex;align-items:center;gap:8px}
.chip-s{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip-s.low{color:var(--red);border-color:var(--red)}
.chip-s.combo{animation:pop .35s ease}
.marks{display:flex;gap:4px}
.marks i{width:16px;height:16px;border-radius:4px;border:2px solid var(--line);background:var(--surface)}
.marks i.on{background:var(--red);border-color:var(--red)}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:6px}
.qcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;font-size:13px;color:var(--muted);font-weight:600;background:var(--surface2);padding:5px 11px;border-radius:999px}
.star{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.star svg{width:20px;height:20px}
.star.on{color:var(--yellow);border-color:var(--yellow)}
.star.on svg path{fill:var(--yellow)}
.signbox{display:flex;justify-content:center;margin:12px 0 2px}
.qtext{font-size:20px;font-weight:600;line-height:1.35;margin:12px 0 4px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:16.5px;line-height:1.35;margin-top:10px;transition:border-color .15s,background .15s}
.opt .n{flex:none;width:27px;height:27px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:not(:disabled):active{background:var(--surface2)}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .n{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .n{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);border-left:5px solid var(--green)}
.feedback.bad{border-left-color:var(--red)}
.feedback b{font-size:17px}
.feedback p{margin:5px 0 0}
.feedback .warnline{color:var(--red);font-weight:600}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;background:var(--sign);color:#fff;font-weight:700;font-size:17px;margin-top:12px;text-align:center}
.btn.secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.stack .btn{margin-top:0}
.xpfloat{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--yellow);color:#2B2100;font-weight:800;padding:6px 14px;border-radius:999px;pointer-events:none;animation:floatup 1s ease forwards;z-index:30;font-family:'Fira Sans Extra Condensed',sans-serif;font-size:20px}

/* results */
.plate{border-radius:18px;padding:5px;color:#fff;margin-top:4px}
.plate.pass{background:var(--hw)} .plate.fail{background:var(--stopred)} .plate.neutral{background:var(--sign)}
.plate .inner{border:2.5px solid rgba(255,255,255,.92);border-radius:14px;padding:18px}
.plate-k{margin:0;font-size:15px;opacity:.9}
.plate-t{margin:2px 0 4px;font-size:52px;font-weight:800;line-height:1}
.plate p{margin:0}
.h2{font-size:24px;font-weight:700;margin:22px 0 8px}
.wcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.wq{margin:0 0 6px;font-weight:600}
.wa{margin:3px 0 0;font-size:15px;padding-left:10px;border-left:3px solid}
.wa.bad{border-color:var(--red)} .wa.ok{border-color:var(--green)}

/* topics */
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:none;background:transparent}
.rows{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.rows .row+.row{border-top:1.5px solid var(--line)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:16.5px;line-height:1.25}
.row .rt small{display:block;color:var(--muted);font-size:13.5px;margin:2px 0 6px}
.row .bar{height:5px}
.pct{flex:none;font-weight:700;font-size:20px;min-width:44px;text-align:right}

/* achievements */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:32px;font-weight:800;line-height:1.05}
.stat span{color:var(--muted);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.badge .e{font-size:28px;line-height:1}
.badge b{display:block;margin-top:6px;font-size:15.5px;line-height:1.25}
.badge span{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.3}
.badge.locked .e{filter:grayscale(1);opacity:.35}
.badge.locked b{color:var(--muted)}
.badge.got{border-color:var(--yellow)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.switch{width:52px;height:30px;border-radius:999px;border:none;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:25px}

/* game */
.hearts{display:flex;gap:4px}
.heart svg{width:24px;height:24px;display:block}
.heart path{fill:#E0303A}
.heart.lost path{fill:var(--line)}
.gscore{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin:2px 2px 10px}
.gscore b{color:var(--ink);font-size:17px}
.xwrap{border-radius:18px;overflow:hidden;border:1.5px solid var(--line);max-width:440px;margin:0 auto;background:var(--verge)}
.xsvg{display:block;width:100%;height:auto;touch-action:manipulation}
.car{cursor:pointer;outline:none}
.car .ring{opacity:0}
.car.blocker .ring{opacity:1;animation:pulse 1s ease-in-out infinite}
.car.miss .body{animation:shake .4s}
.car:focus-visible .ring{opacity:1;stroke:#fff}
.blink{animation:blink .9s steps(1) infinite}
.gmode{color:var(--muted);font-size:14px;margin:10px 2px 0;text-align:center}
.ghint{text-align:center;margin:10px 0 0;font-weight:500}
.over{text-align:center}
.over .big{font-size:56px}

/* overlays */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:min(92vw,420px);z-index:50;transition:transform .3s ease;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:480px}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet p{margin:0;color:var(--muted)}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sheet-btns .btn{margin:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;width:100%;height:100%}

@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
@keyframes blink{0%{opacity:1}50%{opacity:.1}}
@keyframes pulse{0%,100%{stroke-width:3}50%{stroke-width:7}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .blink{animation:none}
}
@media (max-width:360px){ .big{font-size:56px} .tile .t{font-size:19px} .qtext{font-size:18.5px} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
'use strict';
/* ---------- розділи ---------- */
const SEC_LIST=[
 {id:'terms',t:'Терміни та загальні положення',sh:'Терміни',ic:['sq','і']},
 {id:'duties',t:'Обов’язки водія',sh:'Обов’язки водія',ic:['sq','✓']},
 {id:'signals',t:'Світлофор і регулювальник',sh:'Сигнали',ic:['light']},
 {id:'signs',t:'Дорожні знаки',sh:'Знаки',ic:['tri','!']},
 {id:'marking',t:'Дорожня розмітка',sh:'Розмітка',ic:['mark']},
 {id:'maneuver',t:'Маневрування і розташування',sh:'Маневрування',ic:['blue','↱']},
 {id:'speed',t:'Швидкість, обгін, дистанція',sh:'Швидкість і обгін',ic:['circ','50']},
 {id:'stop',t:'Зупинка і стоянка',sh:'Зупинка і стоянка',ic:['nostop']},
 {id:'cross',t:'Проїзд перехресть',sh:'Перехрестя',ic:['dia']},
 {id:'ped',t:'Пішоходи, переїзди, спецтранспорт',sh:'Пішоходи і переїзди',ic:['ped']},
 {id:'light',t:'Світлові прилади і буксирування',sh:'Світло і буксирування',ic:['blue','☀']},
 {id:'safety',t:'Безпека і домедична допомога',sh:'Безпека і допомога',ic:['aid']}
];
const SEC={}; SEC_LIST.forEach(s=>SEC[s.id]=s);

/* ---------- питання (перший варіант — правильний, на екрані перемішуються) ---------- */
const QB=[];
function q(id,s,text,o,e,sign){QB.push({id,s,q:text,o,e,sign:sign||null});}

q('t1','terms','Що таке обгін?',['Випередження одного або кількох ТЗ із виїздом на смугу зустрічного руху','Будь-яке випередження ТЗ, що їде попереду','Перестроювання в сусідню смугу попутного напрямку'],'Обгін — це саме випередження з виїздом на зустрічну смугу. Якщо обганяєш у межах своїх смуг, це просто випередження.');
q('t2','terms','Скільки триває зупинка за ПДР?',['До 5 хвилин, або довше, якщо це потрібно для посадки чи висадки пасажирів або вантажу','До 10 хвилин з будь-якої причини','До 1 хвилини'],'Якщо стоїш понад 5 хвилин з причин, не пов’язаних з посадкою, висадкою чи вантажем, — це вже стоянка.');
q('t3','terms','Що ПДР називає недостатньою видимістю?',['Видимість дороги менше 300 м у темряві, тумані, дощ чи снігопад','Видимість менше 100 м через поворот або підйом','Будь-яку видимість менше 50 м'],'Недостатня видимість — через погоду або темряву. Коли огляд закриває рельєф, поворот чи будівлі, це обмежена оглядовість.');
q('t4','terms','Чи вважається перехрестям виїзд з двору, парковки чи АЗС?',['Ні, виїзди з прилеглих територій — не перехрестя','Так, якщо на виїзді стоїть знак пріоритету','Так, завжди'],'Це прилегла територія. Виїжджаючи з неї, ти поступаєшся і пішоходам, і всім ТЗ на дорозі.');
q('t5','terms','Де проходить межа перехрестя?',['Уявні лінії між початком заокруглень країв проїжджої частини','По стоп-лінії','Там, де стоять знаки пріоритету'],'Перехрестя починається там, де починаються заокруглення країв проїжджої частини.');
q('t6','terms','Що таке темна пора доби?',['Час від кінця вечірніх сутінків до початку ранкових','Час з 22:00 до 6:00','Час від заходу до сходу сонця'],'Сутінки ще не темна пора. Вона починається, коли вечірні сутінки закінчились.');
q('t7','terms','Хто, крім людини за кермом, теж вважається водієм?',['Інструктор, який навчає керування, перебуваючи в цьому ТЗ','Пасажир на передньому сидінні','Власник авто, який сидить поруч'],'Водієм вважається і той, хто навчає керування, перебуваючи безпосередньо в автомобілі.');
q('t8','terms','Яка мінімальна ширина смуги руху за ПДР?',['2,75 м','2,5 м','3,5 м'],'Смуга руху — поздовжня смуга завширшки щонайменше 2,75 м для руху в один ряд, з розміткою або без неї.');

q('d1','duties','Які документи водій має мати при собі (паперові або в Дії)?',['Посвідчення водія, реєстраційний документ на авто і поліс автоцивілки','Лише посвідчення водія','Посвідчення водія і паспорт'],'Усі три документи можна показати й в електронному вигляді.');
q('d2','duties','З якого вмісту алкоголю в крові водій вважається у стані сп’яніння?',['Понад 0,2 проміле','Понад 0,5 проміле','Понад 0,8 проміле'],'Поріг — 0,2 ‰. Навіть невелика доза сповільнює реакцію, тож найбезпечніше — нуль.');
q('d3','duties','Чи можна під час руху говорити по телефону, тримаючи його в руці?',['Ні, лише через гарнітуру або гучний зв’язок','Так, якщо швидкість до 20 км/год','Так, у межах населеного пункту'],'ПДР забороняє користуватися засобами зв’язку, тримаючи їх у руці під час руху.');
q('d4','duties','Ти учасник ДТП, є потерпілі. Що робиш першочергово?',['Зупиняєшся, вмикаєш аварійку, ставиш знак аварійної зупинки, допомагаєш потерпілим і викликаєш швидку та поліцію','Відганяєш авто на узбіччя, щоб не було затору','Їдеш по допомогу і повертаєшся пізніше'],'Переміщувати авто й предмети, що стосуються пригоди, та залишати місце ДТП не можна.');
q('d5','duties','Чи має пристібатися пасажир на задньому сидінні?',['Так, якщо авто обладнане ременями безпеки','Ні, ремінь потрібен лише спереду','Лише поза населеними пунктами'],'Водій не має права перевозити пасажирів, не пристебнутих ременями, — ні спереду, ні ззаду.');
q('d6','duties','Як перевозити в легковику дитину зростом до 145 см або молодшу за 12 років?',['У спеціальному засобі — автокріслі чи бустері, пристебнутою ременем','На руках у дорослого на задньому сидінні','На задньому сидінні, просто пристебнутою'],'Без спеціальних утримувальних засобів таких дітей перевозити заборонено.');
q('d7','duties','У дорозі сильно хилить на сон. Як правильно?',['Зупинитися в дозволеному місці й відпочити','Відкрити вікно й прискоритися, щоб швидше доїхати','Ввімкнути гучну музику й їхати далі'],'Керувати у стані втоми, що впливає на реакцію, ПДР забороняє.');
q('d8','duties','Чи можна дати покермувати другові без посвідчення водія?',['Ні, хіба що це навчальна їзда з інструктором','Так, якщо ти сидиш поруч','Так, на порожній дорозі'],'Передавати керування особі без посвідчення відповідної категорії заборонено, крім навчальної їзди.');

q('g1','signals','Що означає жовтий сигнал світлофора (не миготливий)?',['Забороняє рух і попереджає про зміну сигналів','Дозволяє рух, якщо встигаєш проїхати','Дозволяє рух з обережністю'],'Виняток: якщо зупинитися можна лише екстреним гальмуванням, дозволено проїхати далі.');
q('g2','signals','Що означає миготливий жовтий сигнал?',['Перехрестя нерегульоване: їдь, керуючись знаками пріоритету і правилами проїзду','Світлофор несправний — рух заборонено','Треба обов’язково зупинитися перед стоп-лінією'],'Миготливий жовтий попереджає про небезпеку, а черговість визначають знаки або правило перешкоди справа.');
q('g3','signals','Що означає миготливий зелений?',['Рух дозволено, але скоро ввімкнеться заборонний сигнал','Рух заборонено','Можна повертати лише праворуч'],'Це попередження: оціни, чи встигнеш, і готуйся зупинитися.');
q('g4','signals','Горить червоний і зелена стрілка праворуч у додатковій секції. Що можна?',['Повернути праворуч, давши дорогу ТЗ з інших напрямків','Повернути праворуч з перевагою над усіма','Лише стояти до основного зеленого'],'Рух за стрілкою разом із червоним чи жовтим дозволено, лише якщо ти поступаєшся ТЗ з інших напрямків.');
q('g5','signals','Регулювальник підняв руку вгору. Що це означає?',['Рух заборонено всім учасникам у всіх напрямках','Скоро зміна сигналу — проїжджай швидше','Можна повертати праворуч'],'Як і жовтий: хто не може зупинитися без екстреного гальмування, може проїхати.');
q('g6','signals','Регулювальник стоїть до тебе боком, руки опущені або витягнуті в сторони. Куди можна їхати?',['Прямо і праворуч','Лише праворуч','У будь-якому напрямку'],'З лівого і правого боку регулювальника нерейковим ТЗ можна прямо і праворуч, трамваю — лише прямо.');
q('g7','signals','Регулювальник стоїть до тебе грудьми, права рука витягнута вперед. Куди можна?',['Лише праворуч','Прямо і праворуч','Рух заборонено'],'З боку грудей — лише праворуч. З боку лівого плеча — в усіх напрямках. Зі спини й з правого боку — рух заборонено.');
q('g8','signals','Світлофор і регулювальник показують різне. Кого слухати?',['Регулювальника','Світлофор','Того, хто дозволяє рух'],'Вимоги регулювальника мають перевагу над світлофором і знаками.');

q('z1','signs','Що вимагає цей знак?',['Дати дорогу ТЗ, що їдуть перехрещуваною головною дорогою','Зупинитися перед перехрестям за будь-яких умов','Попереджає про перехрестя рівнозначних доріг'],'Знак 2.1 «Дати дорогу». Зупинятися не обов’язково — лише якщо інакше створиш перешкоду.','giveway');
q('z2','signs','Що вимагає цей знак?',['Зупинитися перед стоп-лінією або краєм перехрещуваної дороги і дати дорогу','Зупинитися, лише коли є інші авто','Знизити швидкість до 20 км/год'],'Знак 2.2 «Проїзд без зупинки заборонено». Зупинка обов’язкова завжди, навіть на порожній дорозі.','stop');
q('z3','signs','Що означає цей знак?',['Головна дорога — перевага на нерегульованих перехрестях','Кінець головної дороги','Попередження про небезпечний поворот'],'Знак 2.3 «Головна дорога». Ті, хто виїжджає з другорядних доріг, мають тебе пропустити.','main');
q('z4','signs','Що означає цей знак?',['Кінець головної дороги — далі переваги вже немає','Головна дорога змінює напрямок','Дорога звужується'],'Знак 2.4 «Кінець головної дороги». На наступному перехресті черговість визначай за знаками або правилом перешкоди справа.','endmain');
q('z5','signs','Що забороняє цей знак?',['В’їзд усіх ТЗ у цьому напрямку','Будь-який рух в обох напрямках','Зупинку і стоянку'],'Знак 3.21 «В’їзд заборонено». Часто стоїть на виїзді з дороги з одностороннім рухом.','noentry');
q('z6','signs','Що означає цей знак?',['Рух усіх ТЗ заборонено','Обмеження швидкості','Дорога з одностороннім рухом'],'Знак 3.1 «Рух заборонено». На відміну від «В’їзд заборонено», забороняє рух загалом.','notraffic');
q('z7','signs','Де закінчується дія цього знака, якщо немає таблички?',['На найближчому перехресті за знаком','Через 1 км','Лише біля знака кінця обмеження'],'Знак 3.29 діє до найближчого перехрестя, а в населеному пункті без перехресть — до його кінця.','speed40');
q('z8','signs','Що забороняє цей знак?',['Зупинку і стоянку','Лише стоянку','Рух усіх ТЗ'],'Знак 3.34 «Зупинку заборонено». Де заборонена зупинка, там і стоянка.','nostopping');
q('z9','signs','Що забороняє цей знак?',['Стоянку, а зупинка дозволена','Зупинку і стоянку','В’їзд'],'Знак 3.35 «Стоянку заборонено» має одну червону смугу. Дві перехрещені — «Зупинку заборонено».','noparking');
q('z10','signs','Що вимагає цей знак?',['Рухатися лише прямо','Рух прямо заборонено','Головна дорога йде прямо'],'Знак 4.1 «Рух прямо» — наказовий, синє коло.','straight');

q('m1','marking','Чи можна перетинати суцільну лінію розмітки?',['Ні','Так, для обгону','Так, якщо немає зустрічних'],'Суцільну лінію 1.1 перетинати заборонено.');
q('m2','marking','Суцільна і переривчаста лінії йдуть поруч. Коли можна їх перетнути?',['Лише з боку переривчастої','З будь-якого боку','З боку суцільної'],'Розмітка 1.11: перетинати дозволено лише з того боку, де переривчаста.');
q('m3','marking','Що означає подвійна суцільна лінія?',['Розділяє зустрічні потоки на дорогах з чотирма й більше смугами; перетинати заборонено','Розділяє смуги одного напрямку, перетинати можна','Позначає місце для розвороту'],'Розмітка 1.3 — як суцільна, тільки на широких дорогах.');
q('m4','marking','Що позначає стоп-лінія?',['Місце зупинки при заборонному сигналі світлофора, регулювальника або знаку «STOP»','Межу перехрестя','Початок пішохідного переходу'],'Розмітка 1.12. Зупиняйся перед нею, не заїжджаючи.');
q('m5','marking','Розмітка показує одне, а тимчасовий знак на переносній стійці — інше. Чим керуватися?',['Тимчасовим знаком','Розміткою','Тим, що зручніше для руху'],'Тимчасові знаки мають перевагу — їх ставлять, наприклад, на час ремонту.');
q('m6','marking','Між смугами переривчаста лінія. Чи можна її перетинати?',['Так, з будь-якого боку, якщо маневр безпечний','Ні, ніколи','Лише для розвороту'],'Переривчасту розмітку 1.5 можна перетинати з обох боків.');

q('v1','maneuver','Чи дає ввімкнений покажчик повороту перевагу в русі?',['Ні, і не звільняє від обов’язку переконатися в безпеці','Так, якщо ввімкнений завчасно','Так, на нерегульованих перехрестях'],'Сигнал лише попереджає інших про твій намір.');
q('v2','maneuver','Ти і сусіднє авто одночасно перестроюєтесь в одну смугу між вами. Хто поступається?',['Той, у кого інше авто праворуч','Той, хто їде швидше','Той, хто праворуч'],'При одночасному перестроюванні поступаються тому, хто праворуч.');
q('v3','maneuver','Де заборонено рух заднім ходом?',['На перехрестях, пішохідних переходах, мостах, у тунелях і на залізничних переїздах','Лише на автомагістралях','Ніде, якщо поруч немає інших авто'],'А також на ділянках з обмеженою оглядовістю чи недостатньою видимістю.');
q('v4','maneuver','Розворот заборонено, якщо видимість дороги хоча б в одному напрямку менша за:',['100 м','50 м','300 м'],'Також розворот заборонено на пішохідних переходах, мостах, у тунелях і на переїздах.');
q('v5','maneuver','Яке положення займати перед поворотом праворуч?',['Крайнє праве на проїжджій частині','Будь-яке, якщо ввімкнено сигнал','Середню смугу'],'Перед поворотом завчасно займай відповідне крайнє положення, якщо знаки чи розмітка не визначають іншого.');
q('v6','maneuver','Ти виїжджаєш із двору на дорогу. Кого пропускаєш?',['І пішоходів, і всі ТЗ, що рухаються дорогою','Лише ТЗ справа','Нікого, якщо ввімкнено поворот'],'Виїзд з прилеглої території — завжди з наданням дороги.');
q('v7','maneuver','Поза населеним пунктом дві смуги в одному напрямку. Ти не обганяєш і не повертаєш. Де їхати?',['Якомога правіше, у правій смузі','У лівій, щоб не заважати повільним','У будь-якій'],'Ліва смуга — для обгону, випередження, повороту ліворуч чи розвороту.');

q('p1','speed','Максимальна швидкість у населеному пункті, якщо знаки не вказують іншого?',['50 км/год','60 км/год','40 км/год'],'Загальне обмеження в населених пунктах — 50 км/год.');
q('p2','speed','Максимальна швидкість у житловій зоні?',['20 км/год','30 км/год','10 км/год'],'У житловій і пішохідній зонах — не більше 20 км/год.');
q('p3','speed','Легковик поза населеним пунктом, звичайна дорога без розділювальної смуги. Максимальна швидкість?',['90 км/год','110 км/год','100 км/год'],'110 — на дорогах з розділювальною смугою, 130 — на автомагістралях.');
q('p4','speed','Максимальна швидкість легковика на автомагістралі?',['130 км/год','110 км/год','150 км/год'],'Для легковиків на автомагістралі — до 130 км/год.');
q('p5','speed','Стаж водія менше 2 років. Яка максимальна швидкість?',['70 км/год','90 км/год','60 км/год'],'Новачкам — не більше 70 км/год навіть там, де іншим можна швидше.');
q('p6','speed','На якій відстані перед залізничним переїздом заборонено обгін?',['Ближче 100 м','Ближче 50 м','Ближче 300 м'],'І на самому переїзді теж.');
q('p7','speed','Тебе обганяють. Що заборонено?',['Перешкоджати обгону — прискорюватися чи заважати іншими діями','Вмикати ближнє світло','Їхати з тією ж швидкістю'],'Водію, якого обганяють, заборонено заважати обгону.');
q('p8','speed','Якою має бути дистанція до авто попереду?',['Такою, щоб уникнути зіткнення, якщо воно раптово загальмує','Не менше 10 м за будь-якої швидкості','Довжина одного автомобіля'],'ПДР не дає числа: дистанція залежить від швидкості, дороги й погоди. Зручний орієнтир — щонайменше 2 секунди.');

q('s1','stop','Біля пішохідного переходу зупинка заборонена ближче ніж:',['10 м з обох боків','5 м з обох боків','20 м перед переходом'],'На самому переході — теж. Виняток: зупинка, щоб пропустити пішоходів.');
q('s2','stop','Біля зупинки громадського транспорту без посадкового майданчика не можна зупинятися ближче ніж:',['30 м від покажчика з обох боків','10 м від покажчика','15 м перед покажчиком'],'Це місце для маршрутних ТЗ.');
q('s3','stop','Зупинка біля перехрестя без пішохідного переходу заборонена ближче ніж:',['10 м від краю перехрещуваної проїжджої частини','5 м','20 м'],'На самому перехресті зупинятися теж не можна, крім випадків, коли ти пропускаєш інших.');
q('s4','stop','Стоянка поблизу залізничного переїзду заборонена ближче ніж:',['50 м','20 м','100 м'],'Зупинятися на самому переїзді заборонено взагалі.');
q('s5','stop','Чи можна зупинитися на мосту?',['Ні','Так, на узбіччі','Так, до 5 хвилин'],'Зупинку заборонено на мостах, шляхопроводах, естакадах і під ними, а також у тунелях.');
q('s6','stop','Коли в населеному пункті можна зупинитися з лівого боку дороги?',['На дорозі з однією смугою в кожному напрямку без трамвайних колій посередині, а також на дорозі з одностороннім рухом','Ніколи','Будь-де, якщо ввімкнена аварійка'],'В інших випадках — лише з правого боку.');

/* ---------- стан і збереження ---------- */
const LS_KEY='zh-pdr-v1';
function defaults(){return {v:1,q:{},xp:0,streak:0,last:null,today:{d:null,n:0},fav:[],exams:{taken:0,passed:0,perfect:0,fast:0,best:0},game:{best:0,total:0},marathon:0,badges:{},sound:true,total:{a:0,c:0},bestCombo:0,updatedAt:0};}
function normalize(o){
  const d=defaults(); if(!o||typeof o!=='object') return d;
  const r=Object.assign(d,o);
  r.today=Object.assign(defaults().today,o.today||{});
  r.exams=Object.assign(defaults().exams,o.exams||{});
  r.game=Object.assign(defaults().game,o.game||{});
  r.total=Object.assign(defaults().total,o.total||{});
  r.q=Object.assign({},o.q||{}); r.badges=Object.assign({},o.badges||{});
  r.fav=Array.isArray(o.fav)?o.fav.filter(id=>QMAP[id]):[];
  return r;
}
let S=defaults();
try{const raw=localStorage.getItem(LS_KEY); if(raw) S=normalize(JSON.parse(raw));}catch(e){}

let dbRef=null, saveTimer=null, saving=false, dirty=false, userName='';
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!dbRef||saving||!dirty) return;
  saving=true; dirty=false;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ const c=e&&e.code; if(c==='unavailable'||c==='resource_exhausted'){dirty=true;} else {dbRef=null;} }
  saving=false;
  if(dirty&&dbRef){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,3000); }
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(user){ try{ const me=await user.me(); if(me&&me.name){ userName=me.name.trim().split(/\s+/)[0]; if(view==='home') render(); } }catch(e){} }
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    if(snap.exists){
      const remote=normalize(JSON.parse(JSON.stringify(snap.data()||{})));
      if((remote.updatedAt||0)>(S.updatedAt||0)){
        S=remote; try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
        if(view==='home'||view==='topics'||view==='ach') render();
      } else if((S.updatedAt||0)>(remote.updatedAt||0)) dirty=true;
    } else if(S.updatedAt) dirty=true;
    dbRef=ref; flush();
  }catch(e){}
}

const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return dstr(new Date());}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return dstr(d);}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<12||m100>14))return b;return c;}
function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function fmtMin(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m} хв ${s} с`:`${s} с`;}
function readiness(list){list=list||QB;if(!list.length)return 0;let t=0;list.forEach(x=>{const st=S.q[x.id];t+=st?Math.min(st.s,2):0;});return t/(2*list.length);}
function mistakesList(){return QB.filter(x=>{const st=S.q[x.id];return st&&st.w>0&&st.s<2;});}
function displayStreak(){return (S.last===todayStr()||S.last===yesterdayStr())?S.streak:0;}
function todayCount(){return S.today.d===todayStr()?S.today.n:0;}
const LEVELS=[[0,'Пішохід'],[100,'Велосипедист'],[250,'Учень автошколи'],[500,'Новачок за кермом'],[900,'Водій'],[1400,'Впевнений водій'],[2000,'Ас дороги'],[3000,'Інструктор']];
function level(){let i=0;LEVELS.forEach((l,k)=>{if(S.xp>=l[0])i=k;});const next=LEVELS[i+1];return {n:i+1,name:LEVELS[i][1],next:next?next[0]:null};}
function hello(){const h=new Date().getHours();const g=h<5?'Доброї ночі':h<12?'Доброго ранку':h<18?'Добрий день':h<23?'Добрий вечір':'Доброї ночі';return userName?`${g}, ${esc(userName)}!`:`${g}!`;}

let AC=null;
function sfx(kind){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,0,.09],[880,.08,.13]],bad:[[200,0,.16],[160,.12,.2]],win:[[523,0,.11],[659,.1,.11],[784,.2,.11],[1047,.3,.3]],badge:[[784,0,.08],[988,.08,.08],[1319,.16,.22]]}[kind];
    const t=AC.currentTime;
    seq.forEach(([f,d,len])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(kind==='bad'?0.05:0.13,t+d+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d+len);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+len+0.03);});
  }catch(e){}
}

/* ---------- облік відповідей ---------- */
function recordAnswer(id,ok){
  const st=S.q[id]||(S.q[id]={c:0,w:0,s:0});
  if(ok){st.c++;st.s++;}else{st.w++;st.s=0;}
  S.total.a++; if(ok) S.total.c++;
  const t=todayStr();
  if(S.today.d!==t) S.today={d:t,n:0};
  S.today.n++;
  if(S.last!==t){ S.streak=(S.last===yesterdayStr())?S.streak+1:1; S.last=t; }
}

/* ---------- квіз ---------- */
const MODE_T={exam:'Іспит',marathon:'Марафон',mistakes:'Робота над помилками',favs:'Обране',train:'Тренування'};
function modeTitleOf(m,sec){return m==='topic'?(SEC[sec]?SEC[sec].sh:'Розділ'):MODE_T[m]||'';}
function startQuiz(mode,list,opts){
  opts=opts||{};
  if(!list.length){ toast(mode==='mistakes'?'Тут з’являться питання, в яких була помилка.':mode==='favs'?'Познач питання зірочкою, і воно з’явиться тут.':'Немає питань.'); return; }
  if(Z&&Z.timer) clearInterval(Z.timer);
  Z={mode,list,i:opts.startAt||0,picked:null,order:null,combo:0,correct:0,mistakes:0,wrong:[],start:Date.now(),limit:mode==='exam'?20*60:0,xp:0,sec:opts.sec||null,timer:null};
  view='quiz'; render(); window.scrollTo(0,0);
  if(mode==='exam') Z.timer=setInterval(tickExam,1000);
}
function remaining(){return Z?Math.max(0,Z.limit-Math.floor((Date.now()-Z.start)/1000)):0;}
function tickExam(){
  if(!Z||Z.mode!=='exam'){return;}
  const r=remaining(); const el=document.getElementById('timer');
  if(el){el.textContent=fmt(r); el.classList.toggle('low',r<=120);}
  if(r<=0) finishQuiz('time');
}
function vQuiz(){
  const qq=Z.list[Z.i]; if(!Z.order) Z.order=shuffle(qq.o.map((_,i)=>i));
  const total=Z.list.length, answered=Z.picked!==null, isFav=S.fav.includes(qq.id);
  let hud='';
  if(Z.mode==='exam'){ const r=remaining(); hud=`<span class="chip-s ${r<=120?'low':''}" id="timer" aria-label="Залишилось часу">${fmt(r)}</span><span class="marks" aria-label="Помилок: ${Z.mistakes} з 2 дозволених">${[0,1].map(i=>`<i class="${i<Z.mistakes?'on':''}"></i>`).join('')}</span>`; }
  else if(Z.combo>=3){ hud=`<span class="chip-s combo" aria-label="Серія правильних відповідей">🔥 ${Z.combo}</span>`; }
  const opts=Z.order.map((oi,k)=>{let cls='opt';if(answered){if(oi===0)cls+=' correct';else if(k===Z.picked)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-act="ans" data-arg="${k}" ${answered?'disabled':''}><span class="n">${k+1}</span><span>${esc(qq.o[oi])}</span></button>`;}).join('');
  let fb='';
  if(answered){
    const ok=Z.order[Z.picked]===0, failNow=Z.mode==='exam'&&Z.mistakes>=3;
    const last=Z.i+1>=total;
    const label=failNow?'До результатів':last?'Завершити':'Далі';
    fb=`<div class="feedback ${ok?'ok':'bad'}" role="status"><b>${ok?'Правильно':'Неправильно'}</b>${qq.e?`<p>${esc(qq.e)}</p>`:''}${failNow?'<p class="warnline">Це третя помилка — іспит зупинено.</p>':''}</div><button class="btn" data-act="next" id="nextBtn">${label}</button>`;
  }
  const num=Z.i+1;
  return `<div class="qtop"><button class="iconbtn" data-act="quitQuiz" aria-label="Вийти">${ICON.close}</button>
    <div class="qprog"><div class="qmeta"><span>${esc(modeTitleOf(Z.mode,Z.sec))}</span><span>${num} з ${total}</span></div><div class="bar"><i style="width:${(Z.i+(answered?1:0))/total*100}%"></i></div></div>
    ${hud?`<div class="hud">${hud}</div>`:''}</div>
  <article class="qcard">
    <div class="qcard-top"><span class="tag">${esc(SEC[qq.s].sh)}</span><button class="star ${isFav?'on':''}" data-act="fav" aria-label="${isFav?'Прибрати з обраного':'Додати в обране'}" aria-pressed="${isFav}">${ICON.star}</button></div>
    ${qq.sign?`<div class="signbox">${signSvg(qq.sign)}</div>`:''}
    <h2 class="qtext">${esc(qq.q)}</h2>
    <div class="opts">${opts}</div>
    ${fb}
  </article>`;
}
function answer(k){
  if(!Z||Z.picked!==null) return;
  const qq=Z.list[Z.i]; if(k<0||k>=qq.o.length) return;
  Z.picked=k; const ok=Z.order[k]===0;
  recordAnswer(qq.id,ok);
  if(ok){ Z.combo++; Z.correct++; const gain=10+Math.min(10,(Z.combo-1)*2); S.xp+=gain; Z.xp+=gain; S.bestCombo=Math.max(S.bestCombo,Z.combo); sfx('ok'); xpFloat('+'+gain+' XP'); }
  else { Z.combo=0; Z.mistakes++; Z.wrong.push({q:qq,picked:qq.o[Z.order[k]]}); sfx('bad'); buzz(); }
  if(Z.mode==='marathon') S.marathon=(Z.i+1>=QB.length)?0:Z.i+1;
  save(); checkBadges(); render();
  const nb=document.getElementById('nextBtn');
  if(nb){ nb.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'}); }
}
function nextQ(){
  if(!Z) return;
  if(Z.mode==='exam'&&Z.mistakes>=3) return finishQuiz('mistakes');
  if(Z.i+1>=Z.list.length) return finishQuiz('end');
  Z.i++; Z.picked=null; Z.order=null; render(); window.scrollTo(0,0);
}
function finishQuiz(reason){
  if(!Z) return;
  if(Z.timer){clearInterval(Z.timer);Z.timer=null;}
  const answeredN=Z.i+(Z.picked!==null?1:0);

/* ---------- гра «Хто проїде першим?» ---------- */
const LET=['А','Б','В'];
const CAR_COLORS=['#2F6FE4','#E8590C','#0F9D7A'];
const MVTXT={s:'прямо',l:'ліворуч',r:'праворуч'};
const PATHS={
  s:{drive:[['M',180,258],['L',180,-60]],arrow:[['M',180,233],['L',180,100]]},
  r:{drive:[['M',180,258],['L',180,222],['Q',180,180,222,180],['L',360,180]],arrow:[['M',180,233],['L',180,222],['Q',180,180,222,180],['L',254,180]]},
  l:{drive:[['M',180,258],['L',180,204],['Q',180,120,96,120],['L',-60,120]],arrow:[['M',180,233],['L',180,204],['Q',180,120,96,120],['L',68,120]]}
};
function rot(x,y,k){let dx=x-150,dy=y-150;for(let i=0;i<k;i++){const t=dx;dx=dy;dy=-t;}return [150+dx,150+dy];}
function pathStr(segs,k){return segs.map(seg=>{let out=seg[0];for(let i=1;i<seg.length;i+=2){const p=rot(seg[i],seg[i+1],k);out+=' '+p[0].toFixed(1)+' '+p[1].toFixed(1);}return out;}).join(' ');}
function relOf(a,b){return (b.dir-a.dir+4)%4;} // 1: b справа від a, 2: зустрічний, 3: b зліва
function conflict(a,b){
  const rel=relOf(a,b);
  if(rel===2) return (a.mv==='l')!==(b.mv==='l');
  const X=rel===1?a:b, Y=rel===1?b:a; // Y — праворуч від X
  if(X.mv==='r') return false;
  if(Y.mv==='r') return X.mv==='s';
  return true;
}
function yieldsTo(a,b,sc){ // чи має a поступитися b (за умови конфлікту)
  if(sc.main){ const am=sc.mainDirs.includes(a.dir), bm=sc.mainDirs.includes(b.dir); if(am!==bm) return !am; }
  const rel=relOf(a,b);
  if(rel===2) return a.mv==='l'&&b.mv!=='l';
  return rel===1;
}
function layersOf(sc,goneSet){
  const left=sc.cars.map((_,i)=>i).filter(i=>!goneSet||!goneSet.has(i));
  const done=new Set(goneSet?[...goneSet]:[]); const layers=[];
  let guard=0;
  while(left.some(i=>!done.has(i))&&guard++<10){
    const ready=left.filter(i=>!done.has(i)&&[...sc.deps[i]].every(j=>done.has(j)));
    if(!ready.length) return null;
    layers.push(ready); ready.forEach(i=>done.add(i));
  }
  return layers;
}
function genScenario(score){
  for(let tries=0;tries<400;tries++){
    const main=score>=3&&Math.random()<0.5;
    const n=score<2?2:(Math.random()<0.65?3:2);
    const dirs=shuffle([0,1,2,3]).slice(0,n);
    const cars=dirs.map(d=>({dir:d,mv:pick(['s','s','l','l','r'])}));
    const sc={main,mainDirs:Math.random()<0.5?[0,2]:[1,3],cars,deps:cars.map(()=>new Set())};
    let bad=false;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ if(relOf(cars[i],cars[j])===2&&cars[i].mv==='l'&&cars[j].mv==='l') bad=true; }
    if(bad) continue;
    if(main){ const m=cars.filter(c=>sc.mainDirs.includes(c.dir)).length; if(m===0||m===n) continue; }
    let edges=0;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ if(i!==j&&conflict(cars[i],cars[j])&&yieldsTo(cars[i],cars[j],sc)){ sc.deps[i].add(j); edges++; } }
    if(!edges) continue;
    if(!layersOf(sc,null)) continue; // взаємне блокування — пропускаємо
    return sc;
  }
  return {main:false,mainDirs:[0,2],cars:[{dir:0,mv:'s'},{dir:1,mv:'s'}],deps:[new Set([1]),new Set()]};
}
function startGame(){ if(G) G.alive=false; G={lives:3,score:0,sc:null,gone:new Set(),anim:0,busy:false,over:false,alive:true}; G.sc=genScenario(0); view='game'; render(); window.scrollTo(0,0); }
function carG(c,i){

    <circle r="31" fill="transparent"/>
    <circle class="ring" r="28" fill="none" stroke="#F2B705" stroke-width="3"/>
    <g class="body"><rect x="-13" y="-22" width="26" height="44" rx="7" fill="${col}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
    <rect x="-10" y="-14" width="20" height="9" rx="3" fill="rgba(12,20,32,.75)"/>
    <rect x="-10" y="9" width="20" height="6" rx="2.5" fill="rgba(12,20,32,.55)"/>
    <rect x="-11" y="-22" width="5" height="2.5" rx="1" fill="#FFF6C8"/><rect x="6" y="-22" width="5" height="2.5" rx="1" fill="#FFF6C8"/>
    ${bl.map(b=>`<circle class="blink" cx="${b[0]}" cy="${b[1]}" r="3.3" fill="#FFB020"/>`).join('')}
    <g class="lbl" transform="rotate(${-ang})"><circle r="9.5" fill="#fff" stroke="#1D2128" stroke-width="1.5"/><text y="4.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2128" font-family="Fira Sans,sans-serif">${LET[i]}</text></g></g>
  </g>`;
}
function drawScenario(){
  const sc=G.sc;
  let s=`<svg viewBox="0 0 300 300" class="xsvg" id="xsvg" role="group" aria-label="Перехрестя з ${sc.cars.length} авто"><defs>${CAR_COLORS.map((c,i)=>`<marker id="mk${i}" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>`;
  s+=`<rect width="300" height="300" style="fill:var(--verge)"/>`;

  s+=`<rect x="89" y="0" width="122" height="300" style="fill:var(--asphalt)"/><rect x="0" y="89" width="300" height="122" style="fill:var(--asphalt)"/>`;
  const dash='style="stroke:var(--mark)" stroke-width="2.5" stroke-dasharray="12 10"';
  s+=`<line x1="150" y1="0" x2="150" y2="80" ${dash}/><line x1="150" y1="220" x2="150" y2="300" ${dash}/><line x1="0" y1="150" x2="80" y2="150" ${dash}/><line x1="220" y1="150" x2="300" y2="150" ${dash}/>`;
  if(sc.main){
    for(let k=0;k<4;k++){ const p=rot(238,240,k);
      s+=sc.mainDirs.includes(k)
        ?`<g transform="translate(${p[0]} ${p[1]})"><polygon points="0,-12 12,0 0,12 -12,0" fill="#fff" stroke="#2A2A2A" stroke-width="1"/><polygon points="0,-7 7,0 0,7 -7,0" fill="#F2B705"/></g>`
        :`<g transform="translate(${p[0]} ${p[1]})"><polygon points="0,10 -12,-10 12,-10" fill="#fff" stroke="#D7262E" stroke-width="3.2" stroke-linejoin="round"/></g>`;
    }
  }
  sc.cars.forEach((c,i)=>{ if(!G.gone.has(i)) s+=`<path id="arr${i}" class="arrow" d="${pathStr(PATHS[c.mv].arrow,c.dir)}" fill="none" stroke="${CAR_COLORS[i]}" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#mk${i})"/>`; });
  sc.cars.forEach((c,i)=>{ if(!G.gone.has(i)) s+=carG(c,i); });
  return s+'</svg>';
}
function vGame(){
  const hearts=[0,1,2].map(i=>`<span class="heart ${i<G.lives?'':'lost'}">${ICON.heart}</span>`).join('');

function afterGameRender(){
  const svg=document.getElementById('xsvg'); if(!svg) return;
  svg.querySelectorAll('.car').forEach(g=>g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapCar(+g.dataset.arg);}}));
}
function driveCar(i,done){
  const c=G.sc.cars[i]; const g=document.getElementById('car'+i), ar=document.getElementById('arr'+i), svg=document.getElementById('xsvg');
  if(ar) ar.style.opacity='0';
  if(!g||!svg){done();return;}
  if(reduced){ g.style.display='none'; done(); return; }
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',pathStr(PATHS[c.mv].drive,c.dir)); p.setAttribute('fill','none'); p.setAttribute('stroke','none');
  svg.appendChild(p);
  const L=p.getTotalLength(), T=1150, t0=performance.now(), lbl=g.querySelector('.lbl');
  const myG=G;
  function step(now){
    if(!myG.alive){p.remove();return;}
    const u=Math.min(1,(now-t0)/T), e=u*u*0.55+u*0.45, d=e*L;
    const a=p.getPointAtLength(Math.max(0,d-0.6)), b=p.getPointAtLength(Math.min(L,d+0.6));
    const ang=Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI;
    const pt=p.getPointAtLength(d);
    g.setAttribute('transform',`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    if(lbl) lbl.setAttribute('transform',`rotate(${(-ang).toFixed(1)})`);
    if(u<1) requestAnimationFrame(step); else { g.style.display='none'; p.remove(); done(); }
  }
  requestAnimationFrame(step);
}
function tapCar(i){
  if(!G||G.busy||G.over||G.gone.has(i)) return;
  const sc=G.sc;
  const blockers=[...sc.deps[i]].filter(j=>!G.gone.has(j));
  if(!blockers.length){
    G.gone.add(i); G.anim++; sfx('ok');
    const g=document.getElementById('car'+i); if(g) g.classList.remove('blocker');
    const myG=G;
    driveCar(i,()=>{ if(!myG.alive) return; myG.anim--; if(myG.gone.size===sc.cars.length&&myG.anim===0&&!myG.busy) cleared(); });
  } else {
    wrongTap(i,blockers[0]);
  }
}
function cleared(){
  G.score++; S.game.total++; S.xp+=15;
  if(G.score>S.game.best) S.game.best=G.score;
  save(); checkBadges(); xpFloat('+15 XP');
  const myG=G;
  setTimeout(()=>{ if(!myG.alive||G!==myG) return; G.sc=genScenario(G.score); G.gone=new Set(); render(); },380);
}
function reasonText(c,b,ci,bi){
  const sc=G.sc, A=`${LET[ci]}`, B=`${LET[bi]}`;
  if(sc.main&&sc.mainDirs.includes(c.dir)!==sc.mainDirs.includes(b.dir)) return `${A} їде другорядною дорогою, тому пропускає ${B} на головній, куди б воно не прямувало (п. 16.11).`;
  if(relOf(c,b)===2) return `${A} повертає ліворуч, тому пропускає зустрічне ${B}, що їде ${MVTXT[b.mv]} (п. 16.13).`;
  return `На рівнозначних дорогах ${A} пропускає ${B}, бо воно наближається справа (п. 16.12).`;
}
function orderText(sc){
  const layers=layersOf(sc,null)||[];
  return layers.map(l=>l.map(i=>LET[i]).join(' і ')+(l.length>1?' одночасно':'')).join(', потім ');
}
function wrongTap(i,b){

  const nb=fb&&fb.querySelector('.btn'); if(nb) nb.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});
}
function gNext(){
  if(!G) return;
  const sc=G.sc, myG=G;
  const btn=document.querySelector('[data-act="gNext"]'); if(btn) btn.disabled=true;
  document.querySelectorAll('.car.blocker').forEach(x=>x.classList.remove('blocker'));
  const layers=layersOf(sc,G.gone)||[];
  let k=0;
  const finish=()=>{ if(!myG.alive||G!==myG) return; if(G.lives<=0){ G.over=true; if(G.score>S.game.best) S.game.best=G.score; save(); checkBadges(); render(); } else { G.busy=false; G.sc=genScenario(G.score); G.gone=new Set(); render(); } };
  const runLayer=()=>{
    if(!myG.alive||G!==myG) return;
    if(k>=layers.length){ setTimeout(finish,250); return; }
    const l=layers[k++]; let left=l.length;

  };

}

/* ---------- добір питань ---------- */
function pickExam(){
  // по кілька питань з кожного розділу, щоб іспит покривав усі теми
  const per=shuffle(SEC_LIST.map(s=>shuffle(BYSEC[s.id]||[])));
  const out=[]; let r=0;
  while(out.length<20&&r<20){ per.forEach(list=>{ if(out.length<20&&list[r]) out.push(list[r]); }); r++; }
  return shuffle(out);
}
function pickTrain(){
  const key=x=>{const st=S.q[x.id];if(!st)return 1;if(st.s===0)return 0;if(st.s===1)return 2;return 3;};
  return shuffle(QB.map(x=>({x,k:key(x)+Math.random()*0.9})).sort((a,b)=>a.k-b.k).slice(0,10).map(o=>o.x));
}

/* ---------- оверлеї ---------- */
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},2600);
}
function xpFloat(txt){ const d=document.createElement('div'); d.className='xpfloat'; d.textContent=txt; document.body.appendChild(d); setTimeout(()=>d.remove(),1050); }
function confirmSheet(title,text,okLabel,onOk){
  const b=document.createElement('div'); b.className='backdrop';
  b.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><h3 id="shT">${esc(title)}</h3><p>${esc(text)}</p><div class="sheet-btns"><button class="btn secondary" data-x="no">Скасувати</button><button class="btn danger" data-x="yes">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(b);
  b.addEventListener('click',e=>{ const x=e.target.closest('[data-x]'); if(e.target===b||(x&&x.dataset.x==='no')) b.remove(); else if(x&&x.dataset.x==='yes'){ b.remove(); onOk(); } });
  const no=b.querySelector('[data-x="no"]'); if(no) no.focus();
}
function confetti(){
  if(reduced) return;
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const dpr=Math.min(2,window.devicePixelRatio||1); const W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr; const ctx=c.getContext&&c.getContext('2d'); if(!ctx){c.remove();return;}
  const cols=['#F2B705','#1D5DBF','#16804A','#D7262E','#ffffff'];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*0.3,y:H*0.35,vx:(Math.random()-.5)*14*dpr,vy:(-Math.random()*14-4)*dpr,w:(5+Math.random()*6)*dpr,h:(8+Math.random()*8)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  const t0=performance.now();
  (function f(now){ const el=now-t0; ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=0.45*dpr;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-el/2600);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(el<2600) requestAnimationFrame(f); else c.remove(); })(t0);
}

/* ---------- дії ---------- */
const ACT={
  home:()=>go('home'),
  sound:()=>{S.sound=!S.sound;save();render();if(S.sound)sfx('ok');},
  examIntro:()=>go('examIntro'),
  startExam:()=>startQuiz('exam',pickExam()),
  train:()=>startQuiz('train',pickTrain()),
  topics:()=>go('topics'),
  topic:a=>startQuiz('topic',shuffle(BYSEC[a]||[]),{sec:a}),
  marathon:()=>startQuiz('marathon',QB,{startAt:S.marathon<QB.length?S.marathon:0}),
  mistakes:()=>startQuiz('mistakes',shuffle(mistakesList())),
  favs:()=>startQuiz('favs',shuffle(QB.filter(x=>S.fav.includes(x.id)))),
  game:()=>startGame(),
  ach:()=>go('ach'),
  ans:a=>answer(+a),
  next:()=>nextQ(),
  fav:()=>{ if(!Z) return; const id=Z.list[Z.i].id; const k=S.fav.indexOf(id); if(k>=0)S.fav.splice(k,1); else S.fav.push(id); save();
    const b=document.querySelector('.star'); if(b){const on=k<0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Прибрати з обраного':'Додати в обране');} toast(k<0?'Додано в обране':'Прибрано з обраного'); },
  quitQuiz:()=>{ if(!Z) return go('home');
    if(Z.mode==='exam') confirmSheet('Вийти з іспиту?','Результат цього іспиту не зарахується. Уже дані відповіді залишаться в статистиці.','Вийти',()=>go('home'));
    else go('home'); },
  car:a=>tapCar(+a),
  gNext:()=>gNext(),
  reset:()=>confirmSheet('Скинути весь прогрес?','Зникнуть відповіді, XP, серія днів, рекорди й досягнення. Це не можна скасувати.','Скинути',()=>{const snd=S.sound;S=defaults();S.sound=snd;save();go('home');toast('Прогрес скинуто');})
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.closest('.backdrop')) return;
  const f=ACT[el.dataset.act]; if(f) f(el.dataset.arg,el);
});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.backdrop')) return;
  if(view==='quiz'&&Z){
    if(Z.picked===null&&/^[1-4]$/.test(e.key)) answer(+e.key-1);
    else if(Z.picked!==null&&e.key==='Enter'&&!(e.target&&e.target.closest&&e.target.closest('button'))) nextQ();
  }
});

render();
checkBadges();
initCloud();
</script>
