<!doctype html>
<!-- Завантаження великого файлу частинами (бот сам забирає лише до 20 МБ). Відкривається кнопкою бота;
     доступ — за Telegram initData дозволених користувачів, частини лягають у KV (див. upload() у src/worker.js). -->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Завантаження файлу</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
  :root{--bg:#EEF2F0;--surface:#fff;--ink:#11201A;--muted:#5B6B64;--line:#DCE5E0;--brand:#12B76A;--brand2:#0E9F8E;--red:#E5484D;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0B1210;--surface:#141D1A;--ink:#E8F0EC;--muted:#8FA199;--line:#25322D;--red:#FF6B6B;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  main{max-width:480px;margin:0 auto;padding:24px 16px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 14px;color:var(--muted)}
  .card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 10px 28px -10px rgba(0,0,0,.25)}
  label.pick{display:block;text-align:center;padding:16px;border-radius:16px;border:2px dashed var(--line);font-weight:700;cursor:pointer}
  input[type=file]{display:none}
  .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:16px 0 8px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
  #st{font-weight:600;color:var(--ink)}
  #st.err{color:var(--red)}
</style>
</head>
<body>
<main>
  <h1>Завантаження файлу</h1>
  <p>Обери PDF — сторінка передасть його частинами. Не закривай її, поки не з’явиться «Готово».</p>
  <div class="card">
    <label class="pick" for="f" id="pickLbl">Обрати файл</label>
    <input type="file" id="f" accept="application/pdf,.pdf">
    <div class="bar"><i id="bar"></i></div>
    <div id="st">Файл ще не обрано</div>
  </div>
</main>
<script>
'use strict';
const PART = 7.5 * 1024 * 1024;
const W = window.Telegram && Telegram.WebApp, initData = W && W.initData || '';
const st = document.getElementById('st'), bar = document.getElementById('bar'), pick = document.getElementById('pickLbl');
const say = (t, err) => { st.textContent = t; st.className = err ? 'err' : ''; };
if (W) { try { W.ready(); W.expand(); } catch (e) {} }
if (!initData) say('Відкрий цю сторінку кнопкою «Завантажити файл» у боті.', true);
async function send(file, i, parts) {
  const blob = file.slice(i * PART, Math.min(file.size, (i + 1) * PART));
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      const r = await fetch('api/upload', { method: 'POST', body: blob, headers: {
        'X-Init-Data': initData, 'X-Part': String(i), 'X-Parts': String(parts),
        'X-Name': encodeURIComponent(file.name), 'X-Size': String(file.size) } });
      if (r.ok) return;
      if (r.status === 401 || r.status === 403) throw new Error('Немає доступу — відкрий сторінку кнопкою в боті.');
    } catch (e) { if (/доступу/.test(e.message)) throw e; }
    await new Promise(res => setTimeout(res, 1500 * attempt));
  }
  throw new Error(`Не вдалося передати частину ${i + 1}. Перевір інтернет і спробуй ще раз.`);
}
document.getElementById('f').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file || !initData) return;
  const parts = Math.ceil(file.size / PART);
  pick.style.pointerEvents = 'none'; pick.textContent = file.name;
  try {
    for (let i = 0; i < parts; i++) {
      say(`Передаю частину ${i + 1} з ${parts}…`);
      await send(file, i, parts);
      bar.style.width = ((i + 1) / parts * 100) + '%';
    }
    say(`Готово: ${file.name} (${(file.size / 1048576).toFixed(1)} МБ). Можна закривати.`);
    try { W.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  } catch (err) {
    say(err.message, true); pick.style.pointerEvents = ''; pick.textContent = 'Спробувати ще раз';
  }
});
</script>
</body>
</html>
